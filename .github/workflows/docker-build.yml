name: Docker Build & Push

on:
  # main, tags and PRs are built by the CI workflow once all checks pass
  push:
    branches:
      - activitypub-test
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the Docker image'
        required: true
        default: 'latest'
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            herrlevin/reisetagebuch
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Needed for the GitHub Actions layer cache (the default docker driver can't export it)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine app version
        id: app_version
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
            TAGS="${{ steps.meta.outputs.tags }}"
          else
            echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            TAGS="${{ steps.meta.outputs.tags }}"
          fi

          # normalize newlines into commas, remove trailing comma
          TAGS=$(printf '%s' "$TAGS" | tr '\n' ',' | sed 's/,$//')
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app_version.outputs.tags || steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels }}
          # PRs only read the cache: GitHub doesn't share PR caches with main or tags anyway
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}
